name: Deploy Main Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (main)
        run: npm run build

      - name: Deploy to GitHub Pages (main)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.RECTARIS_GITHUB_IO_TOKEN }}
          external_repository: rectaris/rectaris.github.io
          publish_branch: main
          publish_dir: ./dist
          destination_dir: timeline
          keep_files: true
